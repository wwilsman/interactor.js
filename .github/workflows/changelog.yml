name: Changelog
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: read
jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
